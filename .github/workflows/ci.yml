name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI smoke test
        run: |
          bash -n scripts/install.sh
          nova --help
          python -c 'from importlib.metadata import version; assert version("nova-agent")'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy nova/

      - name: Security scan (pip-audit)
        # Audit the environment as actually installed from pyproject so the
        # scan reflects what users get. If a transitive CVE needs a pin, add a
        # constraint to pyproject rather than force-upgrading here.
        run: pip-audit

      - name: Test (pytest)
        run: pytest -v
