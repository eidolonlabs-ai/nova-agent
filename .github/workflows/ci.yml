name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade mypy pip-audit idna msgpack urllib3

      - name: CLI smoke test
        run: |
          bash -n scripts/install.sh
          nova --help
          python -c 'from nova import __version__; assert __version__ == "0.1.0"'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy nova/

      - name: Security scan (pip-audit)
        run: pip-audit

      - name: Test (pytest)
        run: pytest -v
